
---
- name: Update package cache
  apt:
    update_cache: yes

- name: Install PostgreSQL
  apt:
    name: postgresql
    state: present

- name: Start PostgreSQL
  command: pg_ctlcluster 14 main start
  register: postgres_start
  failed_when: >
    postgres_start.rc != 0 and
    'already running' not in postgres_start.stderr
  changed_when: postgres_start.rc == 0
