
---
- name: Install Python packages
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: /opt/app
    state: directory

- name: Create Python virtual environment
  command: python3 -m venv /opt/app/venv
  args:
    creates: /opt/app/venv/bin/python

- name: Install Gunicorn
  pip:
    name: gunicorn
    virtualenv: /opt/app/venv

- name: Copy application
  copy:
    src: app.py
    dest: /opt/app/app.py

- name: Start Gunicorn
  command: >
    /opt/app/venv/bin/gunicorn
    --daemon
    --pid /run/gunicorn.pid
    --bind 0.0.0.0:8000
    app:app
  args:
    chdir: /opt/app
    creates: /run/gunicorn.pid
